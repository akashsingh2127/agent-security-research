[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-security-research"
version = "0.1.0"
description = "Research harness for policy-based verification of tool-using AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Security Research Team" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

# Primary dependency constraints are maintained in root requirements.txt
# to avoid independently maintained duplicate lists.
# Runtime and development environments are provisioned via requirements.txt.
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["target_app", "security_engine"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q --strict-markers"
markers = [
    "unit: Unit tests for isolated components",
    "integration: Integration tests for API and tool execution",
    "security: Security property invariant verification tests",
    "experiment: Benchmark and comparative evaluation tests",
]

